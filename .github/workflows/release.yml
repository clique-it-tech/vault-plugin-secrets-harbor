name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          release-type: go

      - uses: actions/checkout@v5
        if: steps.rp.outputs.release_created == 'true'

      - uses: actions/setup-go@v6
        if: steps.rp.outputs.release_created == 'true'
        with:
          go-version-file: go.mod

      - name: Build and attach the plugin
        if: steps.rp.outputs.release_created == 'true'
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
            -o dist/vault-plugin-secrets-harbor-linux-amd64 ./cmd/vault-plugin-secrets-harbor
          cd dist
          sha256sum vault-plugin-secrets-harbor-linux-amd64 > SHA256SUMS
          gh release upload "${{ steps.rp.outputs.tag_name }}" \
            vault-plugin-secrets-harbor-linux-amd64 SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
