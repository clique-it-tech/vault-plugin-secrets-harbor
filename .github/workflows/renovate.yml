name: Renovate

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: arc-deploy
    container:
      image: harbor.cliqueit.tech/proxy-ghcr/renovatebot/renovate:43.288.0@sha256:3b72fc4274c56f65f53dcd4dcbed3143289358e0a2d96f7af215e6cf1923e5f6
    steps:
      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://stronghold.k8s.cliqueit.tech
          method: kubernetes
          path: kubernetes_local
          role: ci
          secrets: |
            github/token/renovate token | RENOVATE_TOKEN

      - run: renovate
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_TOKEN: ${{ env.RENOVATE_TOKEN }}
          RENOVATE_BASE_DIR: ${{ runner.temp }}/renovate
